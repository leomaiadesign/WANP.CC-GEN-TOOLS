<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WANP.CC - HALFTONE GENERATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-panel">
        <a href="../../index.html" style="color: #aaa; text-decoration: none; font-size: 0.8rem; margin-bottom: 10px; display: inline-block;">&larr; Back to Hub</a>
        <h1 style="margin-top: 0;">HALFTONE <span class="badge">GEN TOOL</span></h1>
        
        <div class="control-group">
            <label for="imageUpload" class="custom-file-upload">
                Upload Image
            </label>
            <input type="file" id="imageUpload" accept="image/*">
        </div>

        <div class="control-group" style="flex-direction: row; gap: 5px; align-items: flex-end;">
            <div style="flex:1;">
                <label for="bgColor" style="margin-bottom: 5px;">BG Color</label>
                <input type="color" id="bgColor" value="#ffffff" style="width:100%; height:35px; cursor:pointer;">
            </div>
            <button id="swapColorsBtn" style="padding: 0 10px; height: 35px; font-weight: bold; width: auto; border-radius: 4px;" title="Swap Colors">⇄</button>
            <div style="flex:1;">
                <label for="fgColor" style="margin-bottom: 5px;">Element Color</label>
                <input type="color" id="fgColor" value="#000000" style="width:100%; height:35px; cursor:pointer;">
            </div>
        </div>

        <div class="control-group">
            <label for="resolution">Grid Density (Detail)</label>
            <div class="slider-group">
                <input type="range" id="resolution" min="1" max="20" value="4" step="0.5">
                <input type="number" id="resolution_num" min="1" max="20" value="4" step="0.5">
            </div>
        </div>

        <div class="control-group">
            <label for="spacing">Spacing (Spread)</label>
            <div class="slider-group">
                <input type="range" id="spacing" min="0.1" max="5" value="1" step="0.1">
                <input type="number" id="spacing_num" min="0.1" max="5" value="1" step="0.1">
            </div>
        </div>

        <div class="control-group">
            <label for="halftoneMode">Halftone Mapping</label>
            <select id="halftoneMode">
                <option value="dark">Dark Areas = Large Elements</option>
                <option value="light">Light Areas = Large Elements</option>
            </select>
        </div>

        <div class="control-group">
            <label for="particleSize">Base Size</label>
            <div class="slider-group">
                <input type="range" id="particleSize" min="0.5" max="15" value="3.5" step="0.1">
                <input type="number" id="particleSize_num" min="0.5" max="15" value="3.5" step="0.1">
            </div>
        </div>

        <div class="control-group">
            <label for="styleMode">Element Style</label>
            <select id="styleMode">
                <option value="dots">Dots (Circles)</option>
                <option value="squares">Squares</option>
                <option value="lines">Vertical Lines</option>
                <option value="ascii">ASCII</option>
            </select>
        </div>

        <div class="control-group" style="margin-top: 10px; padding-top: 15px; border-top: 1px solid var(--border);">
            <label>Presets</label>
            <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                <select id="presetSelect" style="flex: 1; min-width: 0;">
                    <option value="">-- Select Preset --</option>
                </select>
                <button id="resetPresetBtn" style="width: auto; padding: 0 10px; font-size: 0.8rem;" title="Reload selected preset (undo changes)">↻</button>
                <button id="savePresetBtn" style="width: auto; padding: 0 15px;" title="Save current settings">Save</button>
            </div>
            <div id="presetActions" style="display: none; gap: 5px;">
                <button id="renamePresetBtn" style="flex: 1; padding: 5px; font-size: 0.75rem;">Rename</button>
                <button id="deletePresetBtn" style="flex: 1; padding: 5px; font-size: 0.75rem; border-color: #f44336; color: #f44336;">Delete</button>
            </div>
        </div>

        <div class="export-group">
            <button id="exportPngBtn">Export PNG</button>
            <button id="exportSvgBtn">Export SVG (Vector)</button>
        </div>
        
        <p style="font-size: 0.75rem; color: #888; text-align: center; margin-top: 10px;">
            Scroll to Zoom. Click and Drag to Pan.
        </p>
    </div>

    <div id="canvas-container" style="position: relative;">
        <canvas id="canvas1"></canvas>
        <div id="zoomUI" style="position: absolute; bottom: 20px; right: 20px; display: flex; gap: 15px; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px; align-items: center; z-index: 20;">
            <span id="zoomLabel" style="color: #fff; font-family: monospace; font-size: 14px; min-width: 45px; text-align: right;">100%</span>
            <button id="resetZoomBtn" style="padding: 4px 10px; font-size: 12px; border: 1px solid #fff; border-radius: 4px; color: #fff; background: transparent; cursor: pointer; text-transform: uppercase;">Reset View</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
