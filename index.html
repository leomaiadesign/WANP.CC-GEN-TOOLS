<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WANP.CC - TOOLKIT</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 2rem;
        }
        .tool-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
            max-width: 600px;
            padding: 0 2rem;
        }
        .tool-card {
            background-color: #222;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1.5rem;
            text-decoration: none;
            color: #fff;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .tool-card:hover {
            border-color: #555;
            transform: translateY(-2px);
            background-color: #2a2a2a;
        }
        .tool-title {
            font-size: 1.25rem;
            font-weight: 600;
        }
        .tool-desc {
            font-size: 0.9rem;
            color: #aaa;
            line-height: 1.4;
        }
        .badge {
            background: #fff;
            color: #000;
            padding: 2px 6px;
            font-size: 0.7rem;
            border-radius: 4px;
            font-weight: bold;
            vertical-align: middle;
            margin-left: 10px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <h1>WANP.CC <span class="badge">TOOLKIT</span></h1>
    
    <div class="tool-grid">
        <a href="tools/halftone/index.html" class="tool-card">
            <div class="tool-title">HALFTONE GENERATOR</div>
            <div class="tool-desc">Converta imagens em padrões de meio-tom usando pontos, quadrados, linhas ou ASCII.</div>
        </a>
        
        <a href="tools/mosaic-builder/index.html" class="tool-card">
            <div class="tool-title">MOSAIC BUILDER</div>
            <div class="tool-desc">Pinte ou apague manualmente quadrados num grid para criar mosaicos sobrepostos a uma imagem.</div>
        </a>

        <!-- Future tools will be added here -->
    </div>
</body>
</html>
